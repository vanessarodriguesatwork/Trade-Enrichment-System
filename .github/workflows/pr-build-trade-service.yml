# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Enhanced with AI Agent PR Review functionality

name: PR Build for trade-service

on:
  pull_request:
    branches: [ "master" ]

    
permissions:
  contents: read
  pull-requests: write
  issues: read


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Agentic PR Review configuration
  
  REVIEW_MODEL_PROVIDER: anthropic
  REVIEW_MODEL: claude-opus-4-5

  REVIEW_FAIL_ON_SEVERITY: MAJOR
  REVIEW_MAX_FINDINGS: 20
  REVIEW_CONTEXT_MAX_CHARS: 20000
  REVIEW_PATCH_MAX_CHARS: 20000
  REVIEW_MAX_CHANGED_FILES: 20


  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better analysis
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn -f ./trade-service/pom.xml clean test


    - name: Install Python dependencies
      run: pip install "anthropic==0.55.0"

    - name: Run Agentic PR Review
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: python .github/agents/pr_review_agent.py


         

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
